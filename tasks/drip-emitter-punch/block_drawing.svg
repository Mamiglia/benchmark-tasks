<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="sans-serif" font-size="12">
  <rect width="640" height="360" fill="#fff"/>
  <text x="20" y="24" font-size="14">Tool block: pine 2x4 offcut, 120 x 89 x 38 mm (all dimensions mm)</text>
  <!-- top view: 120 (long) x 89, scale 2 px/mm -->
  <text x="40" y="52">Top view</text>
  <rect x="40" y="60" width="240" height="178" fill="#f2deb5" stroke="#000"/>
  <circle cx="84" cy="149" r="6" fill="#fff" stroke="#000"/>
  <circle cx="236" cy="149" r="5" fill="#fff" stroke="#000"/>
  <line x1="40" y1="149" x2="280" y2="149" stroke="#888" stroke-dasharray="4 3"/>
  <text x="50" y="178">6 dia (punch)</text>
  <text x="196" y="178">5 dia (dripper)</text>
  <line x1="40" y1="255" x2="84" y2="255" stroke="#000"/><text x="52" y="270">22</text>
  <line x1="84" y1="255" x2="236" y2="255" stroke="#000"/><text x="152" y="270">76</text>
  <line x1="236" y1="255" x2="280" y2="255" stroke="#000"/><text x="250" y="270">22</text>
  <text x="140" y="292">120</text>
  <line x1="295" y1="60" x2="295" y2="238" stroke="#000"/><text x="300" y="153">89</text>
  <text x="40" y="320">Both holes on the centre line (44.5 from each long edge), drilled 34 deep (4 mm left below).</text>
  <!-- side section -->
  <text x="380" y="52">Section on the centre line</text>
  <rect x="380" y="100" width="240" height="76" fill="#f2deb5" stroke="#000"/>
  <rect x="418" y="100" width="12" height="68" fill="#fff" stroke="#000"/>
  <rect x="566" y="100" width="10" height="68" fill="#fff" stroke="#000"/>
  <line x1="630" y1="100" x2="630" y2="176" stroke="#000"/><text x="602" y="196">38</text>
  <line x1="460" y1="100" x2="460" y2="168" stroke="#000"/><text x="464" y="140">34</text>
  <text x="380" y="230">Lies flat on the bed, long side along y (left-right),</text>
  <text x="380" y="246">punch hole on the robot's right.</text>
</svg>
